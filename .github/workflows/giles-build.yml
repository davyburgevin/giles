name: Giles · Apple Silicon build and release
on:
  push:
    tags: ['giles-v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish the version recorded in giles.json
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: giles-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: Verify Apple Silicon and product version
        run: |
          test "$(uname -m)" = arm64
          python3 scripts/giles/check.py
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "giles-v$(python3 -c 'import json; print(json.load(open("giles.json"))["version"])')"
          fi
      - name: Import personal signing identity
        env:
          GILES_CERTIFICATE_P12: ${{ secrets.GILES_CERTIFICATE_P12 }}
          GILES_CERTIFICATE_PASSWORD: ${{ secrets.GILES_CERTIFICATE_PASSWORD }}
        run: python3 scripts/giles/signing.py
      - name: Verify personal update signature compatibility
        run: node scripts/giles/signing-acceptance.mjs
      - name: Build complete Giles app
        run: python3 scripts/giles/build.py
      - name: Verify packaged application
        run: python3 scripts/giles/verify.py apps/desktop/release/mac-arm64/Giles.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Giles-macOS-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: |
          security delete-keychain "$GITHUB_WORKSPACE/.giles-signing/giles.keychain-db" || true
          rm -rf "$GITHUB_WORKSPACE/.giles-signing"
  release:
    if: startsWith(github.ref, 'refs/tags/giles-v') || inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: Giles-macOS-arm64
          path: artifacts
      - name: Publish Giles release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("giles.json"))["version"])')
          tag="giles-v$version"
          gh release create "$tag" artifacts/* --target "$GITHUB_SHA" --title "Giles $version" --notes 'Giles for macOS Apple Silicon. Includes the original Hermes Python engine. Personally self-signed; not Apple-notarized.' --latest
